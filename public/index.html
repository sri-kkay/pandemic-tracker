<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Epidemic &amp; Pandemic Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="labels"></div>
<div id="tip"></div>

<div id="topbar">
  <div id="crumbs"></div>
  <div id="zoomstate">world</div>
</div>

<!-- TOP-LEFT: latest outbreaks -->
<section class="panel" id="feed">
  <div class="phead">
    <span class="eyebrow">Latest outbreaks</span>
    <button class="collapse" data-t="feed">−</button>
  </div>
  <div id="feedhead" style="padding:7px 12px;border-bottom:1px solid var(--hairline);font-family:var(--font-num);font-size:9.5px;color:var(--ink-mute);letter-spacing:.05em">
  </div>
  <div class="pbody" style="display:flex;flex-direction:column;min-height:0">
    <div id="feedfilter">
      <span class="eyebrow">Min severity</span>
      <input type="range" id="thr" min="0" max="100" value="0" step="5">
      <span id="thrval">0</span>
    </div>
    <label id="routinetoggle">
      <input type="checkbox" id="showroutine">
      <span>Include routine weekly surveillance</span>
      <span id="routinecount"></span>
    </label>
    <div id="feedsort">
      <button class="on" data-sort="recent">Newest</button>
      <button data-sort="severity">Worst</button>
      <button data-sort="stale">Most stale</button>
    </div>
    <div id="feedlist"></div>
  </div>
</section>

<!-- BOTTOM-LEFT: legend -->
<section class="panel" id="legend">
  <div class="phead">
    <span class="eyebrow">Severity key</span>
    <button class="collapse" data-t="legend">−</button>
  </div>
  <div class="pbody">
    <div class="ramp" id="ramp"></div>
    <div class="ramplabels">
      <span>0–19</span><span>20–39</span><span>40–59</span><span>60–79</span><span>80+</span>
    </div>
    <div class="legrow"><span class="swatch" style="background:var(--nodata)"></span> Hatched — no current reporting</div>
    <div class="legrow"><span class="swatch" style="background:#DC2626;box-shadow:inset 0 0 0 1px #fff"></span> White edge — fast growth (7d)</div>
    <div class="legrow" style="color:var(--ink-dim);font-size:10.5px;line-height:1.4">Fill saturation tracks cases per 100k. Bar heights show how many places sit in each tier.</div>
  </div>
</section>

<!-- RIGHT: info -->
<section class="panel" id="info">
  <div class="phead">
    <span class="eyebrow" id="infoeyebrow">Selection</span>
    <button class="collapse" data-t="info">−</button>
  </div>
  <div class="pbody" id="infobody"></div>
</section>

<!-- BOTTOM-RIGHT: utility drawer -->
<section class="panel" id="drawer">
  <div id="tabs">
    <button class="on" data-tab="treatments">Treat</button>
    <button data-tab="travel">Travel</button>
    <button data-tab="avoid">Avoid</button>
    <button data-tab="prevention">Prevent</button>
  </div>
  <div id="dsel" style="display:none"></div>
  <div id="tabbody"></div>
</section>

<div id="stale"></div>

<div id="boot">
  <div id="boottxt">Loading boundaries</div>
  <div id="bootbar"><i></i></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
