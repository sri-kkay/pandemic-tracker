/* ── THE DRAWER ────────────────────────────────────────────────────────────
   Every disease on the globe has an entry behind it. The server builds them
   (api/guidance.js) and hands them over keyed by the exact disease name, so
   the lookup here is normally a straight hit.

   The three fallbacks below exist for the cases where it isn't: running the
   page off the bundled snapshot with the scraper down, or a disease name the
   server's own resolver didn't recognise.
     1. exact key
     2. case-insensitive, then longest key contained in the name — this is what
        makes "Ebola (Bundibugyo virus)" find the "Ebola" entry
     3. ask the public reference API directly from the browser, cache it, and
        repaint when it lands
   ------------------------------------------------------------------------- */

const gCache = new Map();     // disease name -> entry, for client-side lookups
const gPending = new Set();   // in-flight lookups, so we don't fire twice

function guidanceFor(name){
  if(!name) return null;
  const G = SEED.guidance || {};
  if(G[name]) return G[name];
  if(gCache.has(name)) return gCache.get(name);

  const keys = Object.keys(G).filter(k => !k.startsWith('_'));
  const lower = name.toLowerCase();

  const ci = keys.find(k => k.toLowerCase() === lower);
  if(ci) return G[ci];

  // longest key that appears inside the reported name
  let best = null;
  for(const k of keys){
    const kl = k.toLowerCase();
    if(lower.includes(kl) && (!best || kl.length > best.length)) best = kl;
  }
  if(best){
    const k = keys.find(x => x.toLowerCase() === best);
    return { ...G[k], appliedFrom: k };
  }
  return null;
}

/* Browser-side version of the server's auto-resolver. Only runs when the
   server didn't supply an entry — normally never. Same source, same shape. */
async function autoGuidance(name){
  if(gCache.has(name) || gPending.has(name)) return;
  gPending.add(name);
  try{
    const api = 'https://en.wikipedia.org/w/api.php';
    const s = await (await fetch(`${api}?action=query&list=search&srsearch=`
      + encodeURIComponent(name + ' disease') + '&srlimit=1&format=json&origin=*')).json();
    const title = s?.query?.search?.[0]?.title;
    if(!title) throw new Error('no article');

    const p = await (await fetch(`${api}?action=query&prop=extracts&explaintext=1&redirects=1&titles=`
      + encodeURIComponent(title) + '&format=json&origin=*')).json();
    const extract = Object.values(p?.query?.pages || {})[0]?.extract;
    if(!extract) throw new Error('no extract');

    const sec = {}; let cur = 'intro'; sec[cur] = '';
    for(const line of extract.split('\n')){
      const h = line.match(/^\s*(={2,6})\s*(.+?)\s*\1\s*$/);
      if(h){ cur = h[2].toLowerCase().trim(); sec[cur] = ''; }
      else sec[cur] += ' ' + line;
    }
    const sent = txt => String(txt||'').replace(/\s+/g,' ').replace(/\[\d+\]/g,'')
      .split(/(?<=[.!?])\s+(?=[A-Z(])/).map(x=>x.trim())
      .filter(x => x.length > 40 && x.length < 320);
    const pick = (cands, n=3) => {
      for(const w of cands) for(const [h,b] of Object.entries(sec))
        if(h.includes(w)){ const v = sent(b); if(v.length) return v.slice(0,n); }
      return [];
    };

    const intro = sent(sec.intro).slice(0,2);
    const entry = {
      auto:true,
      treatments: pick(['treatment','management','therapy']).length ? pick(['treatment','management','therapy']) : intro,
      travel: ['No travel guidance is published for this disease yet — it is new to this pipeline.',
               `Check <a href="https://wwwnc.cdc.gov/travel/notices" target="_blank" rel="noopener">CDC travel notices</a> and the WHO advisory before travelling.`],
      avoid: pick(['transmission','cause','risk factor','spread'],2).map(x=>'Known route of spread: '+x),
      prevention: pick(['prevention','vaccine','vaccination','control']),
      symptoms: pick(['signs and symptoms','symptoms','presentation']).length ? pick(['signs and symptoms','symptoms','presentation']) : intro,
      detection: pick(['diagnosis','screening','testing']),
      source:'Auto-compiled from public reference sources — unverified',
      url:'https://en.wikipedia.org/wiki/' + encodeURIComponent(title.replace(/ /g,'_'))
    };
    for(const k of ['avoid','prevention','detection']) if(!entry[k].length) entry[k] = ['Not established by the automatic lookup. See the source bulletin.'];
    gCache.set(name, entry);
  }catch(e){
    // Cache the failure too, so the drawer stops saying "looking this one up"
    // and the lookup isn't retried on every repaint.
    gCache.set(name, { ...SEED.guidance._default, pending:true,
      treatments:['No guidance is loaded for this disease and the automatic lookup did not return one.',
                  'Use the source bulletin linked in the panel above — it is outbreak-specific and more reliable than general advice.'] });
  }finally{
    gPending.delete(name);
    if(S.disease === name) renderDrawer(currentEntity().rec?.diseases || []);
  }
}

const CHIPS = [
  { q:'symptoms',  field:'symptoms'  },
  { q:'detection', field:'detection' },
  { q:'places',    field:'avoid'     },
  { q:'other',     field:null        }
];

function renderDrawer(dis){
  const body = $('#tabbody'), sel = $('#dsel');

  if(!dis.length){
    sel.style.display = 'none';
    body.innerHTML = `<div style="color:var(--ink-dim);font-size:12px;line-height:1.55">${t('drawer.empty')}</div>`;
    return;
  }

  // Which disease is the drawer talking about? Keep the user's pick if it's
  // still present at this location, otherwise fall back to the most severe one.
  const names = [...new Set(dis.map(d => d.name))];
  if(!names.includes(S.disease)){
    S.disease = names.slice().sort((a,b)=>
      (diseaseSeverity(dis.find(d=>d.name===b)) ?? -1) -
      (diseaseSeverity(dis.find(d=>d.name===a)) ?? -1))[0];
  }
  const name = S.disease;

  // selector row — only worth showing when there's a choice to make
  if(names.length > 1){
    sel.style.display = 'flex';
    sel.innerHTML = names.map(n=>{
      const tr = tierOf(diseaseSeverity(dis.find(d=>d.name===n)));
      return `<button class="${n===name?'on':''}" data-d="${esc(n)}">
        <i style="background:${tr.hex}"></i>${esc(n)}</button>`;
    }).join('');
    sel.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ S.disease = b.dataset.d; S.chip = null; renderDrawer(dis); };
    });
  } else {
    sel.style.display = 'none';
  }

  let g = guidanceFor(name);
  if(!g){ autoGuidance(name); g = SEED.guidance._default; }

  const items = (g[S.tab] || []).filter(Boolean);

  const tag = g.auto
    ? `<span class="gtag" style="color:${PAL.warn};border-color:${PAL.warn}66;background:${PAL.warn}14">${t('drawer.auto')}</span>`
    : g.pending
      ? `<span class="gtag" style="color:var(--ink-dim);border-color:var(--hairline-hi)">${t('drawer.pending')}</span>`
      : '';

  const applied = g.appliedFrom && g.appliedFrom !== name
    ? `<div class="gapplied">${t('drawer.applied', {src:esc(g.appliedFrom), name:esc(name)})}</div>`
    : '';

  body.innerHTML = `
    ${tag}${applied}
    ${items.length
      ? `<ul>${items.map(i=>`<li dir="auto">${i}</li>`).join('')}</ul>`
      : `<div style="color:var(--ink-dim);font-size:12px">${t('drawer.noGuidance', {kind:t('guide.'+S.tab), name:esc(name)})}</div>`}
    <div class="gsrc" dir="auto">
      ${esc(g.source || t('sourcePending'))}
      ${g.url ? ` · <a href="${esc(g.url)}" target="_blank" rel="noopener">${t('openSource')}</a>` : ''}
      <br>${esc(SEED.guidance._disclaimer || '')}
    </div>
    <div class="chips">
      ${CHIPS.map(c=>`<button class="chip ${S.chip===c.q?'on':''}" data-q="${c.q}">${t('chip.'+c.q)}</button>`).join('')}
    </div>
    <div id="chipans"></div>`;

  body.querySelectorAll('.chip').forEach(b=>{
    b.onclick = ()=>{ S.chip = (S.chip === b.dataset.q) ? null : b.dataset.q; renderDrawer(dis); };
  });

  if(S.chip) renderChipAnswer(g, name);
}

/* The four FAQ chips from the spec, answered from the same entry the tabs use.
   No round trip, no API key, and it works with the scraper down. */
function renderChipAnswer(g, name){
  const box = $('#chipans');
  const spec = CHIPS.find(c => c.q === S.chip);
  if(!spec) return;
  box.style.display = 'block';

  if(spec.field){
    const lines = (g[spec.field] || []).filter(Boolean);
    box.innerHTML = `<div class="qh">${t('chiphead.'+spec.q)} · ${esc(name)}</div>` +
      (lines.length ? `<ul>${lines.map(l=>`<li dir="auto">${l}</li>`).join('')}</ul>`
                    : `<div style="color:var(--ink-dim)">${t('chip.notLoaded')}</div>`);
    return;
  }

  const place = currentEntity().name;
  box.innerHTML = `
    <div class="qh">${t('chiphead.other')} · ${esc(name)}</div>
    <div style="color:var(--ink-dim);font-size:11.5px;line-height:1.5">${t('ask.intro')}</div>
    <input id="askq" type="text" placeholder="${esc(t('ask.placeholder',{place}))}" autocomplete="off">
    <div class="chips">
      <button class="chip" data-go="who">${t('ask.who')}</button>
      <button class="chip" data-go="cdc">${t('ask.cdc')}</button>
    </div>`;

  const go = which=>{
    const q = ($('#askq').value || '').trim();
    const term = encodeURIComponent(`${name} ${place} ${q}`.trim());
    const url = which === 'who'
      ? 'https://www.who.int/home/search?indexCatalogue=genericsearchindex1&searchQuery=' + term
      : 'https://search.cdc.gov/search/?query=' + term;
    window.open(url, '_blank', 'noopener');
  };
  box.querySelectorAll('[data-go]').forEach(b => b.onclick = ()=> go(b.dataset.go));
  $('#askq').onkeydown = e => { if(e.key === 'Enter') go('who'); };
}

/* ── the report log ────────────────────────────────────────────────────────
   Every disease-at-a-place is one line, with its age in the gutter. Age is
   the first thing you read, because a stale figure is the failure mode that
   actually bites this project.                                              */

function feedRows(){
  const rows = [];
  for(const [iso, rec] of Object.entries(SEED.countries || {})){
    const cf = S.countries?.features.find(f => isoOf(f) === iso);
    const place = cf ? nameOf(cf) : iso;
    (rec.diseases || []).forEach(d=>{
      rows.push({ level:'country', iso, place, region:null, key:iso,
        name:d.name, sev:diseaseSeverity(d) ?? entitySeverity(rec),
        asOf:d.asOf, cases:d.cases, routine:!!d.routine });
    });
  }
  for(const [key, rec] of Object.entries(SEED.admin1 || {})){
    const [iso, region] = key.split(':');
    (rec.diseases || []).forEach(d=>{
      rows.push({ level:'state', iso, place:region, region, key,
        name:d.name, sev:diseaseSeverity(d) ?? entitySeverity(rec),
        asOf:d.asOf, cases:d.cases, routine:!!d.routine });
    });
  }
  for(const [key, rec] of Object.entries(SEED.cities || {})){
    const [iso, city] = key.split(':');
    (rec.diseases || []).forEach(d=>{
      rows.push({ level:'city', iso, place:city, region:null, key,
        name:d.name, sev:diseaseSeverity(d) ?? entitySeverity(rec),
        asOf:d.asOf, cases:d.cases, routine:!!d.routine });
    });
  }
  return rows;
}

function renderFeed(){
  const rows = feedRows();
  const sorters = {
    recent:   (a,b) => (ageDays(a.asOf) ?? 99999) - (ageDays(b.asOf) ?? 99999),
    severity: (a,b) => (b.sev ?? -1) - (a.sev ?? -1),
    stale:    (a,b) => (ageDays(b.asOf) ?? -1) - (ageDays(a.asOf) ?? -1)
  };
  rows.sort(sorters[S.sort] || sorters.recent);

  const routineCount = rows.filter(r => r.routine).length;
  $('#routinecount').textContent = routineCount
    ? t(S.showRoutine ? 'filter.shown' : 'filter.hidden', {n:routineCount})
    : '';

  const counted = S.showRoutine ? rows : rows.filter(r => !r.routine);
  const vis = counted.filter(r => (r.sev ?? 0) >= S.threshold);

  const dated = counted.map(r => ageDays(r.asOf)).filter(v => v != null);
  const newest = dated.length ? Math.min(...dated) : null;
  const undated = counted.length - dated.length;
  const places = new Set(counted.map(r => r.key)).size;

  $('#feedcount').textContent = vis.length === counted.length
    ? String(counted.length)
    : `${vis.length} / ${counted.length}`;

  $('#footstat').textContent = dated.length
    ? t('foot.stat', {n:counted.length, c:places, age:ago(newest)})
      + (undated ? ' · ' + t('feed.undated', {n:undated}) : '')
    : t('feed.headNoDates', {n:counted.length});

  $('#feedlist').innerHTML = vis.length ? vis.map(r=>{
    const tr = tierOf(r.sev);
    const f  = freshness(r.asOf);
    return `<button class="fitem" data-iso="${esc(r.iso)}" data-region="${esc(r.region||'')}" data-disease="${esc(r.name)}">
      <span class="fage" style="color:${f.hex}">${esc(f.short)}</span>
      <span class="fbody" style="--tick:${tr.hex}">
        <span class="ftitle" dir="auto">${esc(r.name)}<span class="fplace"> — ${esc(r.place)}</span></span>
        <span class="fmeta">
          <span class="lv">${t('level.'+r.level)}</span>
          ${r.routine ? `<span class="lv" style="opacity:.6">${t('tag.routine')}</span>` : ''}
          <span>${r.cases != null ? t('cases',{n:fmt(r.cases)}) : t('nocount')}</span>
          <span style="color:${tr.hex}">${esc(tierLabel(r.sev))}</span>
        </span>
      </span>
    </button>`;
  }).join('') : `<div class="fempty">${t('feed.empty', {n:S.threshold})}</div>`;

  $('#feedlist').querySelectorAll('.fitem').forEach(el=>{
    el.onclick = ()=>{
      const iso = el.dataset.iso;
      const region = el.dataset.region;
      // open the drawer on the disease the user actually clicked, not the
      // worst one at that location
      S.disease = el.dataset.disease || null;
      S.chip = null;
      if(window.matchMedia('(max-width:900px)').matches) showSheet(null);
      if(region){
        ensureAdmin1();
        const r = regionByName(iso, region);
        if(r){ selectAdmin1(iso, r); return; }
      }
      selectCountry(iso);
    };
  });
}

/* ── the spine ─────────────────────────────────────────────────────────────
   Legend, distribution and filter in one control: how many countries sit in
   each tier, and clicking a tier raises the feed threshold to it.           */

function renderSpine(){
  const counts = [0,0,0,0,0];
  S.entities.forEach(e=>{
    if(e.level!=='country' || e.sev==null) return;
    counts[tierIndex(e.sev)]++;
  });
  const mx = Math.max(1, ...counts);
  const mins = [0,20,40,60,80];

  $('#tierrows').innerHTML = TIERS.map((tier,i)=>`
    <button class="tierrow ${S.threshold > mins[i] ? 'dimmed' : ''}" data-min="${mins[i]}">
      <span class="tname">${esc(t('tier.'+i))}</span>
      <span class="tbarwrap"><span class="tbar" style="width:${Math.max(2,(counts[i]/mx)*100)}%;background:${tier.hex}"></span></span>
      <span class="tcount">${counts[i]||''}</span>
    </button>`).join('');

  $('#tierrows').querySelectorAll('.tierrow').forEach(b=>{
    b.onclick = ()=>{
      const min = +b.dataset.min;
      S.threshold = (S.threshold === min) ? 0 : min;
      $('#thr').value = S.threshold; $('#thrval').textContent = S.threshold;
      renderFeed(); renderSpine();
    };
  });

  $('#legnote').innerHTML =
    `${esc(t('legend.hatched'))}<br>${esc(t('legend.edge'))}<br>${esc(t('legend.saturation'))}`;
}

function renderCrumbs(){
  const v = S.view, out = [];
  out.push({t:t('crumb.world'), fn:goWorld, now:v.level==='world'});
  if(v.continent) out.push({t:continentLabel(v.continent), fn:()=>selectContinent(v.continent), now:v.level==='continent'});
  if(v.iso){
    const f = S.countries?.features.find(x=>isoOf(x)===v.iso);
    out.push({t:f?nameOf(f):v.iso, fn:()=>selectCountry(v.iso), now:v.level==='country'});
  }
  if(v.region) out.push({t:v.region, now:v.level==='admin1'});
  if(v.city)   out.push({t:v.city, now:true});
  const c = $('#crumbs'); c.innerHTML = '';
  out.forEach((o,i)=>{
    if(i) c.insertAdjacentHTML('beforeend','<span class="sep">›</span>');
    const b = document.createElement('button');
    b.className = 'cr'+(o.now?' now':''); b.textContent = o.t;
    if(o.fn) b.onclick = o.fn;
    c.appendChild(b);
  });
  document.body.classList.toggle('deep', v.level !== 'world');
  $('#zoomstate').textContent = zoomHint();
}

/* Says what tier you're on AND what the next scroll would reveal. */
function zoomHint(){
  if(S._a1failed) return t('zoom.statesMissing');
  const lod = currentLOD();
  if(lod === 'world')  return `${t('zoom.countries')} · ${t('zoom.nextStates')}`;
  if(lod === 'region') return S.admin1 ? `${t('zoom.states')} · ${t('zoom.nextCities')}`
                                       : `${t('zoom.states')} · ${t('zoom.loading')}…`;
  return S.cities ? t('zoom.cities') : `${t('zoom.cities')} · ${t('zoom.loading')}…`;
}

function renderLabels(){
  const box = $('#labels'); box.innerHTML='';
  const lod = currentLOD();
  let list = [];

  if(lod === 'city' && S.cities){
    // Only label the tiers that have faded in, and cap the count, so the
    // view never turns into a wall of text. Tier 0 = capitals + megacities.
    const c = fadeIn(cam.z, FADE.city.hi, FADE.city.lo);
    const maxTier = cam.z < 1.45 ? 2 : (cam.z < 1.65 ? 1 : 0);
    if(c > 0.15){
      list = S.cities
        .filter(x => x[3] <= maxTier)
        .slice(0, 400)
        .map(x => ({
          name:x[0], lat:x[2], lon:x[1], city:true,
          sev: S.entities.get(x[4] + ':' + x[0])?.sev ?? null
        }));
    }
  } else if(lod !== 'world' && S.countries){
    list = S.countries.features
      .filter(f => SEED.countries[isoOf(f)])
      .map(f=>{ const c = centroidOf(f); return {name:nameOf(f), lat:c.lat, lon:c.lon, sev:S.entities.get(isoOf(f))?.sev}; });
  }
  const camDir = new THREE.Vector3(0,0,1);
  const onScreen = [];
  for(const it of list){
    const p = latLonToVec(it.lat, it.lon, R*1.005);
    const w = p.clone().applyMatrix4(spin.matrixWorld);
    if(w.clone().normalize().dot(camDir) < 0.12) continue;    // back of the globe
    const s = w.clone().project(camera);
    if(Math.abs(s.x) > 1 || Math.abs(s.y) > 1) continue;
    onScreen.push({ it, x:(s.x*0.5+0.5)*wellW, y:(-s.y*0.5+0.5)*wellH,
                    d: s.x*s.x + s.y*s.y });
  }
  // nearest the centre of the view wins, and stop at a readable number
  onScreen.sort((a,b) => a.d - b.d);
  const LIMIT = 34;
  const placed = [];
  for(const o of onScreen){
    if(placed.length >= LIMIT) break;
    // crude de-clutter: skip anything sitting on top of a label already placed
    if(placed.some(q => Math.abs(q.x-o.x) < 68 && Math.abs(q.y-o.y) < 15)) continue;
    placed.push(o);
    const el = document.createElement('div');
    el.className = 'lbl';
    el.style.left = o.x + 'px';
    el.style.top  = o.y + 'px';
    el.innerHTML = `<i style="background:${tierOf(o.it.sev).hex}"></i>${esc(o.it.name)}`;
    box.appendChild(el);
  }
}

function refresh(){
  const lod = currentLOD();
  if(lod !== lastLOD || S.view.iso !== lastFocus){
    lastLOD = lod; lastFocus = S.view.iso; S.lod = lod;
    paint(); rebuildBorders();
  }
  renderCrumbs(); renderInfo(); renderFeed(); renderSpine();
}

function note(msg){
  const el = $('#stale'); el.textContent = msg; el.style.display='block';
  clearTimeout(el._t); el._t = setTimeout(()=>el.style.display='none', 7000);
}

/* The FAQ chips answer from the same guidance entry the tabs use, which works
   offline and needs no key. Kept for a future assistant panel; point it at
   your own /api/ask route — the browser cannot call an LLM provider directly
   without exposing the key. */
function askAssistant(kind, disease, place){
  note(`Assistant not connected — wire askAssistant() to your /api/ask route. (${kind} · ${disease||'—'} · ${place})`);
}

/* ── 14. LOOP ─────────────────────────────────────────────────────────── */

let lastLabelPaint = 0;
function tick(){
  requestAnimationFrame(tick);
  cam.rx += (cam.trx - cam.rx)*0.12;
  cam.ry += (cam.try_ - cam.ry)*0.12;
  cam.z  += (cam.tz  - cam.z )*0.10;
  tilt.rotation.x = cam.rx;
  spin.rotation.y = cam.ry;
  camera.position.z = cam.z;
  updateDetailLayers();
  const lod = currentLOD();
  if(lod !== lastLOD){
    lastLOD = lod; S.lod = lod;
    paint(); renderCrumbs();
  }
  spin.updateMatrixWorld();
  const now = performance.now();
  if(now - lastLabelPaint > 50){ lastLabelPaint = now; renderLabels(); }
  renderer.render(scene, camera);
}

/* ── 15. CHROME ───────────────────────────────────────────────────────── */

function showSheet(which){
  document.body.classList.remove('sheet-reports','sheet-selection');
  if(which) document.body.classList.add('sheet-'+which);
  document.querySelectorAll('#sheettabs button').forEach(b=>
    b.classList.toggle('on', b.dataset.sheet === which));
  onResize();
}

function bindUI(){
  // appearance + language
  document.querySelectorAll('[data-theme-set]').forEach(b=>
    b.onclick = ()=> setTheme(b.dataset.themeSet));
  $('#langsel').onchange = e => setLang(e.target.value);

  // filters
  $('#thr').oninput = e=>{ S.threshold = +e.target.value; $('#thrval').textContent = e.target.value; renderFeed(); renderSpine(); };
  $('#showroutine').onchange = e=>{ S.showRoutine = e.target.checked; renderFeed(); };
  document.querySelectorAll('#feedsort button').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('#feedsort button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); S.sort = b.dataset.sort; renderFeed();
    };
  });

  // drawer tabs
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); S.tab = b.dataset.tab; renderInfo();
    };
  });

  // panels
  $('#focusbtn').onclick = ()=>{
    document.body.classList.toggle('focus');
    $('#focusbtn').textContent = document.body.classList.contains('focus') ? t('focus.show') : t('focus.hide');
    onResize();
  };
  $('#backbtn').onclick = goUp;
  document.querySelectorAll('#sheettabs button').forEach(b=>{
    b.onclick = ()=> showSheet(document.body.classList.contains('sheet-'+b.dataset.sheet) ? null : b.dataset.sheet);
  });

  // entry screen
  $('#enterbtn').onclick = enterMap;
}

function enterMap(){
  const e = $('#entry');
  if(!e || e.classList.contains('gone')) return;
  e.classList.add('gone');
  setTimeout(()=>{ e.style.display = 'none'; onResize(); }, 480);
  onResize();
}

function progress(p, key){
  $('#bootbar').style.width = p+'%';
  const btn = $('#enterbtn');
  if(p >= 100){
    btn.disabled = false;
    btn.querySelector('span').textContent = t('enter');
    btn.focus({preventScroll:true});
  } else if(key){
    btn.querySelector('span').textContent = t(key);
  }
}

/* ═══ THE INTEGRATION POINT ═══════════════════════════════════════════════
   Replace the body of this function with a fetch of your pipeline's output.
   Keep the shape identical to SEED and nothing else needs to change.
   ═══════════════════════════════════════════════════════════════════════ */
async function loadData(){
  try{
    const r = await fetch('/api/outbreaks', { cache:'no-store' });
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    Object.assign(SEED, j);
    console.log('Live data loaded:', Object.keys(j.countries||{}).length, 'countries');
  }catch(e){
    console.warn('Scraper unreachable, using bundled snapshot:', e);
    note(t('note.offline'));
  }
  return SEED;
}

async function boot(){
  setLang(pickLang(), false);
  setTheme(THEME_PREF, false);
  bindUI();
  initScene(); bindInput();
  setTheme(THEME_PREF);          // now that the GL objects exist

  progress(15, 'boot.boundaries');
  try{
    S.countries = await fetchFirst(GEO.countries);
  }catch(err){
    $('#enterbtn').querySelector('span').textContent = t('boot.failed');
    return;
  }
  progress(55, 'boot.indexing');
  S.countries.features.forEach(f=>{
    const iso = isoOf(f), cont = contOf(f);
    S.byISO.set(iso, {name:nameOf(f), cont, pop:f.properties.POP_EST || 1});
    if(!S.continents.has(cont)) S.continents.set(cont, []);
    S.continents.get(cont).push(iso);
  });

  progress(72, 'boot.applying');
  await loadData();
  buildEntities();

  progress(88, 'boot.painting');
  paint();
  rebuildBorders();
  refresh();
  tick();

  progress(100);

  // Pull the state and city datasets straight away, in the background, so
  // there's no stall the first time someone zooms in.
  ensureAdmin1();
  ensureCities();

  const age = Math.round((Date.now()-new Date(SEED.updated))/86400000);
  if(age > 7) note(t('note.old', {n:age}));
}

boot();
</script>
