<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Global Epidemic &amp; Pandemic Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   DUTY STATION — the console skin.
   One saturated colour family in the whole interface: the severity ramp.
   Everything else is graphite and bone, docked flush, separated by hairlines.
   Both themes are declared here; JS resolves "system" to one of them and
   writes it to <html data-theme>. Nothing in the CSS reads the media query,
   so the theme can be forced from the entry screen.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --rail:322px;
  --dossier:356px;
  --strip:46px;
  --font-display:'Archivo','IBM Plex Sans',system-ui,sans-serif;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Noto Sans','Noto Sans Arabic','Noto Sans Devanagari','Noto Sans SC',sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#0E1113;
  --console:#151A1D;
  --console-2:#1B2226;
  --well:#080A0B;
  --hairline:#242A2E;
  --hairline-hi:#39424A;
  --ink:#E7E3DA;
  --ink-mute:#9C978C;
  --ink-dim:#6C6860;
  --hover:rgba(255,255,255,.045);
  --sunk:rgba(0,0,0,.28);
  --s0:#21A45C; --s1:#D0A02C; --s2:#E8743B; --s3:#D93A3A; --s4:#8E2020;
  --nodata:#3A4046;
}
html[data-theme="light"]{
  --bg:#D3D6D1;
  --console:#F0F1EC;
  --console-2:#E3E6E0;
  --well:#C6CAC7;
  --hairline:#C2C6C0;
  --hairline-hi:#A4A9A2;
  --ink:#13171A;
  --ink-mute:#545954;
  --ink-dim:#7B807A;
  --hover:rgba(0,0,0,.05);
  --sunk:rgba(0,0,0,.05);
  --s0:#1B7F45; --s1:#8F6710; --s2:#BC5320; --s3:#AE2320; --s4:#761A1A;
  --nodata:#A6A59A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;
  -webkit-font-smoothing:antialiased;
}
canvas{display:block}
button,select,input{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

.eyebrow{
  font-family:var(--font-num);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-dim);font-weight:500;
}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display);font-stretch:118%;font-weight:600;letter-spacing:.01em}

/* ── frame ─────────────────────────────────────────────────────────────── */
#app{
  display:grid;height:100dvh;
  grid-template-columns:var(--rail) minmax(0,1fr) var(--dossier);
  grid-template-rows:var(--strip) minmax(0,1fr) auto;
}
body.focus #app{grid-template-columns:0 minmax(0,1fr) 0}
body.focus #rail,body.focus #dossier{display:none}

/* ── status strip ──────────────────────────────────────────────────────── */
#strip{
  grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 12px;
  background:var(--console);border-block-end:1px solid var(--hairline);z-index:30;
}
#mark{display:flex;align-items:center;gap:9px;flex:none}
#markglyph{display:grid;grid-template-columns:repeat(2,4px);grid-template-rows:repeat(2,4px);gap:1px}
#markglyph i{display:block;width:4px;height:4px}
#markglyph i:nth-child(1){background:var(--s0)}
#markglyph i:nth-child(2){background:var(--s1)}
#markglyph i:nth-child(3){background:var(--s2)}
#markglyph i:nth-child(4){background:var(--s4)}
#marktext{
  font-family:var(--font-display);font-stretch:125%;font-weight:700;
  font-size:11px;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;
}
#crumbs{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;flex:1}
#crumbs .cr{font-size:12.5px;color:var(--ink-mute);white-space:nowrap;padding:2px 0}
#crumbs .cr:hover{color:var(--ink)}
#crumbs .cr.now{color:var(--ink);font-weight:500}
#crumbs .sep{color:var(--ink-dim);font-size:11px}
#zoomstate{
  font-family:var(--font-num);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-dim);white-space:nowrap;flex:none;
}
#stripctl{display:flex;align-items:center;gap:8px;flex:none;margin-inline-start:auto}
.seg{display:flex;border:1px solid var(--hairline);border-radius:3px;overflow:hidden}
.seg button{
  padding:5px 8px;font-family:var(--font-num);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-dim);
}
.seg button+button{border-inline-start:1px solid var(--hairline)}
.seg button:hover{color:var(--ink-mute);background:var(--hover)}
.seg button.on{color:var(--ink);background:var(--console-2)}
#langsel{
  appearance:none;background:transparent;border:1px solid var(--hairline);border-radius:3px;
  padding:5px 22px 5px 8px;font-family:var(--font-num);font-size:9.5px;letter-spacing:.08em;
  color:var(--ink-mute);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 12px) 12px,calc(100% - 8px) 12px;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
html[dir="rtl"] #langsel{padding:5px 8px 5px 22px;background-position:12px 12px,8px 12px}
#langsel:hover{color:var(--ink);border-color:var(--hairline-hi)}
#langsel option{background:var(--console);color:var(--ink)}
.iconbtn{
  padding:5px 8px;border:1px solid var(--hairline);border-radius:3px;color:var(--ink-dim);
  font-family:var(--font-num);font-size:9px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;
}
.iconbtn:hover{color:var(--ink);border-color:var(--hairline-hi)}

/* ── left rail: the report log ─────────────────────────────────────────── */
#rail{
  grid-column:1;grid-row:2;background:var(--console);border-inline-end:1px solid var(--hairline);
  display:flex;flex-direction:column;min-height:0;z-index:20;
}
.railhead{
  display:flex;align-items:baseline;gap:8px;padding:11px 14px 9px;
  border-block-end:1px solid var(--hairline);
}
.railhead h2{font-family:var(--font-display);font-stretch:120%;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#feedcount{font-family:var(--font-num);font-size:9.5px;color:var(--ink-dim);margin-inline-start:auto;text-align:end}
#controls{padding:9px 14px;border-block-end:1px solid var(--hairline);display:flex;flex-direction:column;gap:9px}
.ctlrow{display:flex;align-items:center;gap:10px}
#thr{flex:1;accent-color:var(--s2);height:2px}
#thrval{font-family:var(--font-num);font-size:10px;color:var(--ink-mute);min-width:18px;text-align:end}
#routinetoggle{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-mute);cursor:pointer}
#routinetoggle:hover{color:var(--ink)}
#showroutine{accent-color:var(--s2);width:12px;height:12px;flex:none;cursor:pointer}
#routinecount{margin-inline-start:auto;font-family:var(--font-num);font-size:9px;color:var(--ink-dim);white-space:nowrap}
#feedsort{display:flex;gap:5px}
#feedsort button{
  flex:1;font-family:var(--font-num);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-dim);padding:5px 3px;border:1px solid var(--hairline);border-radius:3px;
}
#feedsort button:hover{color:var(--ink-mute)}
#feedsort button.on{color:var(--ink);background:var(--console-2);border-color:var(--hairline-hi)}

#feedlist{overflow-y:auto;flex:1;min-height:0}
/* the log: a mono age gutter, a continuous rule, a severity tick per entry */
.fitem{
  display:grid;grid-template-columns:42px 1fr;gap:10px;padding:9px 14px 9px 10px;cursor:pointer;
  border-block-end:1px solid var(--hairline);text-align:start;width:100%;
}
.fitem:hover{background:var(--hover)}
.fage{
  font-family:var(--font-num);font-size:9.5px;color:var(--ink-dim);padding-top:2px;
  text-align:end;white-space:nowrap;
}
.fbody{min-width:0;border-inline-start:1px solid var(--hairline);padding-inline-start:11px;position:relative}
.fbody::before{content:'';position:absolute;inset-inline-start:-3px;top:4px;width:5px;height:5px;background:var(--tick);border-radius:50%}
.ftitle{display:block;font-size:12.5px;line-height:1.35;color:var(--ink)}
.fplace{color:var(--ink-mute)}
.fmeta{
  font-family:var(--font-num);font-size:9px;letter-spacing:.05em;color:var(--ink-dim);
  margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
}
.fmeta .lv{text-transform:uppercase;letter-spacing:.12em}
.fempty{padding:18px 14px;color:var(--ink-dim);font-size:12px;line-height:1.5}

/* ── the spine: tier ledger, legend and filter in one control ──────────── */
#spine{border-block-start:1px solid var(--hairline);padding:11px 14px 12px;background:var(--console)}
#spinehead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:9px}
.tierrow{
  display:grid;grid-template-columns:64px 1fr 26px;align-items:center;gap:8px;
  width:100%;padding:2px 0;text-align:start;cursor:pointer;
}
.tierrow:hover .tname{color:var(--ink)}
.tname{font-family:var(--font-num);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute)}
.tbarwrap{height:8px;background:var(--sunk);position:relative}
.tbar{position:absolute;inset-block:0;inset-inline-start:0;min-width:2px}
.tcount{font-family:var(--font-num);font-size:9.5px;color:var(--ink-dim);text-align:end}
.tierrow.dimmed{opacity:.4}
.legnote{margin-top:10px;font-size:10.5px;line-height:1.5;color:var(--ink-dim)}
.legnote b{color:var(--ink-mute);font-weight:500}

/* ── globe well ────────────────────────────────────────────────────────── */
#well{grid-column:2;grid-row:2;position:relative;overflow:hidden;background:var(--well);min-width:0}
#labels{position:absolute;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.lbl{
  position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:var(--font-num);font-size:9.5px;letter-spacing:.05em;
  color:var(--ink);text-shadow:0 1px 3px var(--well),0 0 6px var(--well);
  display:flex;align-items:center;gap:5px;
}
.lbl i{width:5px;height:5px;border-radius:50%;display:block;flex:none}
#tip{
  position:absolute;pointer-events:none;z-index:40;opacity:0;transition:opacity .1s;
  background:var(--console);border:1px solid var(--hairline-hi);padding:9px 11px;
  min-width:160px;max-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.28);
}
#tip .tn{font-size:12.5px;font-weight:500;margin-bottom:6px;line-height:1.25}
#tip .td{font-family:var(--font-num);font-size:10px;color:var(--ink-mute);display:flex;justify-content:space-between;gap:12px;padding:1px 0}
#tip .tt{
  display:flex;align-items:center;gap:6px;margin-top:7px;padding-top:7px;
  border-top:1px solid var(--hairline);font-family:var(--font-num);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;
}
#stale{
  position:absolute;inset-block-end:14px;inset-inline-start:50%;transform:translateX(-50%);z-index:25;
  font-size:11.5px;line-height:1.4;max-width:min(440px,86%);
  color:var(--ink);background:var(--console);border:1px solid var(--hairline-hi);
  padding:9px 13px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.28);
}
html[dir="rtl"] #stale{transform:translateX(50%)}
#backbtn{
  position:absolute;inset-block-start:12px;inset-inline-start:12px;z-index:25;
  padding:6px 10px;background:var(--console);border:1px solid var(--hairline);
  font-family:var(--font-num);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-mute);display:none;
}
#backbtn:hover{color:var(--ink);border-color:var(--hairline-hi)}
body.deep #backbtn{display:block}

/* ── right column: selection dossier + guidance drawer ─────────────────── */
#dossier{
  grid-column:3;grid-row:2;background:var(--console);border-inline-start:1px solid var(--hairline);
  display:flex;flex-direction:column;min-height:0;z-index:20;
}
#infobody{overflow-y:auto;flex:1;min-height:0}
#idhead{padding:13px 16px 14px;border-block-end:1px solid var(--hairline)}
#idtop{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
#idname{
  font-family:var(--font-display);font-stretch:110%;font-weight:600;
  font-size:21px;line-height:1.12;letter-spacing:-.005em;min-width:0;
}
#idscore{font-family:var(--font-num);font-size:34px;font-weight:600;line-height:.9;letter-spacing:-.03em;flex:none}
#idbar{height:3px;margin:11px 0 9px;background:var(--sunk);position:relative}
#idbar i{position:absolute;inset-block:0;inset-inline-start:0;display:block}
#idmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-family:var(--font-num);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim)}
#idmeta .dot{width:5px;height:5px;border-radius:50%;display:inline-block;margin-inline-end:5px}
#idscorelbl{font-family:var(--font-num);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-dim);margin-top:3px;text-align:end}

.dcard{padding:13px 16px;border-block-end:1px solid var(--hairline)}
.dname{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.dname h4{font-size:13.5px;font-weight:600;line-height:1.25}
.trend{font-family:var(--font-num);font-size:10.5px;font-weight:600;white-space:nowrap}
.stats{display:flex;border-block:1px solid var(--hairline)}
.stat{flex:1;padding:8px 0}
.stat+.stat{border-inline-start:1px solid var(--hairline);padding-inline-start:10px}
.stat .k{font-family:var(--font-num);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:4px}
.stat .v{font-family:var(--font-num);font-size:15px;font-weight:600;letter-spacing:-.02em}
.srcline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;flex-wrap:wrap}
.src{margin-top:6px;font-size:10.5px;line-height:1.5;color:var(--ink-dim)}
a{color:var(--ink-mute);text-decoration:none;border-bottom:1px solid var(--hairline-hi)}
a:hover{color:var(--ink)}
.prov{color:var(--s1)}
.empty{padding:16px;color:var(--ink-dim);font-size:12px;line-height:1.55}

.fresh{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--font-num);
  font-size:9px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;
}
.freshdot{width:5px;height:5px;border-radius:50%;flex:none}

/* drawer */
#drawer{border-block-start:1px solid var(--hairline);display:flex;flex-direction:column;min-height:0;max-height:48%}
#tabs{display:flex;background:var(--console-2)}
#tabs button{
  flex:1;padding:9px 3px;font-family:var(--font-num);font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-dim);border-block-end:2px solid transparent;
}
#tabs button:hover{color:var(--ink-mute)}
#tabs button.on{color:var(--ink);border-block-end-color:var(--s2);background:var(--console)}
#dsel{display:flex;gap:5px;padding:8px 12px;overflow-x:auto;border-block-end:1px solid var(--hairline)}
#dsel::-webkit-scrollbar{height:0}
#dsel button{
  white-space:nowrap;font-size:11px;padding:4px 9px;border:1px solid var(--hairline);
  border-radius:3px;color:var(--ink-dim);flex:none;
}
#dsel button:hover{color:var(--ink-mute)}
#dsel button.on{color:var(--ink);border-color:var(--hairline-hi);background:var(--console-2)}
#dsel button i{width:5px;height:5px;border-radius:50%;display:inline-block;margin-inline-end:6px;vertical-align:middle}
#tabbody{padding:12px 16px 14px;overflow-y:auto;font-size:12.5px;line-height:1.55;color:var(--ink-mute);min-height:0}
#tabbody ul{list-style:none}
#tabbody li{padding:6px 0 6px 14px;position:relative;border-block-end:1px solid var(--hairline)}
#tabbody li:last-child{border-block-end:none}
#tabbody li::before{content:'';position:absolute;inset-inline-start:0;top:13px;width:6px;height:1px;background:var(--ink-dim)}
html[dir="rtl"] #tabbody li{padding:6px 14px 6px 0}
#tabbody li strong{color:var(--ink);font-weight:500}
.gtag{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--font-num);font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid;border-radius:3px;margin-bottom:9px;
}
.gapplied{font-size:10.5px;color:var(--ink-dim);margin-bottom:9px;line-height:1.45}
.gsrc{margin-top:11px;padding-top:10px;border-top:1px solid var(--hairline);font-size:10.5px;line-height:1.5;color:var(--ink-dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-size:11px;padding:5px 9px;border:1px solid var(--hairline);border-radius:3px;color:var(--ink-mute)}
.chip:hover{border-color:var(--hairline-hi);color:var(--ink)}
.chip.on{border-color:var(--s2);color:var(--ink);background:var(--console-2)}
#chipans{margin-top:10px;padding:11px 12px;background:var(--console-2);font-size:12px;line-height:1.5;display:none}
#chipans .qh{font-family:var(--font-num);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:8px}
#chipans ul{list-style:none}
#chipans li{padding:4px 0 4px 12px;position:relative;border:none}
#chipans li::before{content:'';position:absolute;inset-inline-start:0;top:11px;width:5px;height:1px;background:var(--ink-dim)}
html[dir="rtl"] #chipans li{padding:4px 12px 4px 0}
#askq{
  width:100%;margin-top:8px;padding:7px 9px;font-size:12px;background:var(--sunk);
  border:1px solid var(--hairline);color:var(--ink);border-radius:3px;
}
#askq:focus{outline:none;border-color:var(--hairline-hi)}

/* ── foot ──────────────────────────────────────────────────────────────── */
#foot{
  grid-column:1/-1;grid-row:3;display:flex;align-items:center;gap:14px;padding:0 12px;height:26px;
  background:var(--console);border-block-start:1px solid var(--hairline);
  font-family:var(--font-num);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);
  z-index:30;
}
#footsrc{margin-inline-start:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheettabs{display:none;gap:6px}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--hairline-hi);border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ── entry screen ──────────────────────────────────────────────────────── */
#entry{
  position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);
  display:grid;place-items:center;padding:24px;overflow:auto;transition:opacity .45s ease;
}
#entry.gone{opacity:0;pointer-events:none}
#entrygrid{
  width:min(940px,100%);display:grid;grid-template-columns:1.15fr .85fr;gap:0;
  border:1px solid var(--hairline);background:var(--console);
}
.ecol{padding:34px 34px 30px}
.elead{border-inline-end:1px solid var(--hairline)}
#etitle{
  font-family:var(--font-display);font-stretch:125%;font-weight:700;
  font-size:clamp(26px,3.4vw,38px);line-height:1.02;letter-spacing:-.01em;text-transform:uppercase;
}
#etag{margin-top:14px;font-size:13px;line-height:1.6;color:var(--ink-mute);max-width:38ch}
#ekey{margin-top:26px;display:flex;flex-direction:column;gap:0}
#ekey .er{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;padding:6px 0;border-block-end:1px solid var(--hairline)}
#ekey .er:first-child{border-block-start:1px solid var(--hairline)}
#ekey .eswatch{height:6px}
#ekey .ename{font-family:var(--font-num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mute)}
#ekey .erange{font-family:var(--font-num);font-size:9.5px;color:var(--ink-dim)}
#esrc{margin-top:22px;font-family:var(--font-num);font-size:9px;letter-spacing:.1em;line-height:1.9;text-transform:uppercase;color:var(--ink-dim)}
.efield{margin-bottom:22px}
.efield>.eyebrow{display:block;margin-bottom:9px}
#langgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#langgrid button{
  padding:9px 10px;border:1px solid var(--hairline);border-radius:3px;text-align:start;
  font-size:12.5px;color:var(--ink-mute);
}
#langgrid button:hover{border-color:var(--hairline-hi);color:var(--ink)}
#langgrid button.on{border-color:var(--ink-dim);background:var(--console-2);color:var(--ink)}
#themeseg{display:flex;border:1px solid var(--hairline);border-radius:3px;overflow:hidden}
#themeseg button{flex:1;padding:9px 6px;font-family:var(--font-num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
#themeseg button+button{border-inline-start:1px solid var(--hairline)}
#themeseg button:hover{background:var(--hover);color:var(--ink-mute)}
#themeseg button.on{background:var(--console-2);color:var(--ink)}
#enterbtn{
  position:relative;width:100%;padding:14px;border:1px solid var(--ink-dim);border-radius:3px;
  font-family:var(--font-display);font-stretch:118%;font-weight:600;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink);overflow:hidden;
}
#enterbtn:hover:not(:disabled){background:var(--console-2)}
#enterbtn:disabled{color:var(--ink-dim);border-color:var(--hairline);cursor:progress}
#enterbtn span{position:relative;z-index:1}
#bootbar{position:absolute;inset-block-end:0;inset-inline-start:0;height:2px;width:0;background:var(--s2);transition:width .35s ease}
#efine{margin-top:14px;font-size:11px;line-height:1.55;color:var(--ink-dim)}

/* ── narrow screens: rails become sheets ───────────────────────────────── */
@media (max-width:1080px){
  :root{--rail:280px;--dossier:310px}
}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:var(--strip) minmax(0,1fr) auto}
  #well{grid-column:1;grid-row:2}
  #rail,#dossier{
    grid-column:1;grid-row:2;align-self:end;height:62%;
    border:none;border-block-start:1px solid var(--hairline-hi);
    box-shadow:0 -10px 30px rgba(0,0,0,.3);display:none;
  }
  body.sheet-reports #rail{display:flex}
  body.sheet-selection #dossier{display:flex}
  #sheettabs{display:flex;margin-inline-start:auto;flex:none}
  #footsrc,#zoomstate,#focusbtn{display:none}
  #strip{gap:8px}
  #crumbs{flex:1}
  #footstat{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #entrygrid{grid-template-columns:1fr}
  .elead{border-inline-end:none;border-block-end:1px solid var(--hairline)}
  .ecol{padding:26px 22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="app">

  <header id="strip">
    <div id="mark">
      <div id="markglyph"><i></i><i></i><i></i><i></i></div>
      <span id="marktext" data-i18n="mark">Pandemic Tracker</span>
    </div>
    <nav id="crumbs" aria-label="Location"></nav>
    <div id="zoomstate"></div>
    <div id="stripctl">
      <select id="langsel" aria-label="Language"></select>
      <div class="seg" id="themeseg2" role="group" aria-label="Appearance">
        <button data-theme-set="light" data-i18n="theme.lightShort" title="Light">Light</button>
        <button data-theme-set="dark" data-i18n="theme.darkShort" title="Dark">Dark</button>
        <button data-theme-set="system" data-i18n="theme.systemShort" title="System">Auto</button>
      </div>
      <button class="iconbtn" id="focusbtn" data-i18n="focus.hide">Hide panels</button>
    </div>
  </header>

  <aside id="rail">
    <div class="railhead">
      <h2 data-i18n="rail.reports">Reports</h2>
      <span id="feedcount" class="num"></span>
    </div>

    <div id="controls">
      <div class="ctlrow">
        <span class="eyebrow" data-i18n="filter.minSeverity">Min severity</span>
        <input type="range" id="thr" min="0" max="100" value="0" step="5" aria-label="Minimum severity">
        <span id="thrval">0</span>
      </div>
      <label id="routinetoggle">
        <input type="checkbox" id="showroutine">
        <span data-i18n="filter.routine">Include routine weekly surveillance</span>
        <span id="routinecount"></span>
      </label>
      <div id="feedsort" role="group">
        <button class="on" data-sort="recent" data-i18n="sort.newest">Newest</button>
        <button data-sort="severity" data-i18n="sort.worst">Worst</button>
        <button data-sort="stale" data-i18n="sort.stale">Most stale</button>
      </div>
    </div>

    <div id="feedlist"></div>

    <div id="spine">
      <div id="spinehead">
        <span class="eyebrow" data-i18n="spine.title">Countries by severity</span>
        <span class="eyebrow" style="letter-spacing:.06em;text-transform:none" data-i18n="spine.hint">Click a tier to filter</span>
      </div>
      <div id="tierrows"></div>
      <div class="legnote" id="legnote"></div>
    </div>
  </aside>

  <main id="well">
    <div id="labels"></div>
    <div id="tip" role="status"></div>
    <button id="backbtn" data-i18n="back">Back</button>
    <div id="stale" role="status"></div>
  </main>

  <aside id="dossier">
    <div id="infobody"></div>
    <div id="drawer">
      <div id="tabs" role="tablist">
        <button class="on" data-tab="treatments" data-i18n="tab.treatments">Treatments</button>
        <button data-tab="travel" data-i18n="tab.travel">Travel</button>
        <button data-tab="avoid" data-i18n="tab.avoid">Avoid</button>
        <button data-tab="prevention" data-i18n="tab.prevention">Prevention</button>
      </div>
      <div id="dsel" style="display:none"></div>
      <div id="tabbody"></div>
    </div>
  </aside>

  <footer id="foot">
    <span id="footstat"></span>
    <span id="footsrc"></span>
    <div class="seg" id="sheettabs">
      <button data-sheet="reports" data-i18n="rail.reports">Reports</button>
      <button data-sheet="selection" data-i18n="sheet.selection">Selection</button>
    </div>
  </footer>

</div>

<div id="entry">
  <div id="entrygrid">
    <div class="ecol elead">
      <h1 id="etitle" data-i18n="title">Global Epidemic &amp; Pandemic Tracker</h1>
      <p id="etag" data-i18n="tagline"></p>
      <div id="ekey"></div>
      <div id="esrc"></div>
    </div>
    <div class="ecol">
      <div class="efield">
        <span class="eyebrow" data-i18n="language">Language</span>
        <div id="langgrid"></div>
      </div>
      <div class="efield">
        <span class="eyebrow" data-i18n="appearance">Appearance</span>
        <div id="themeseg" role="group">
          <button data-theme-set="light" data-i18n="theme.light">Light</button>
          <button data-theme-set="dark" data-i18n="theme.dark">Dark</button>
          <button data-theme-set="system" data-i18n="theme.system">System</button>
        </div>
      </div>
      <button id="enterbtn" disabled><span data-i18n="preparing">Preparing the map</span><i id="bootbar"></i></button>
      <p id="efine" data-i18n="entry.note"></p>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

let LANG = 'en';
function pickLang(){
  const saved = localStorage.getItem('pt.lang');
  if(saved && STR[saved]) return saved;
  for(const p of (navigator.languages || [navigator.language || 'en'])){
    const base = String(p).toLowerCase().split('-')[0];
    if(STR[base]) return base;
  }
  return 'en';
}
function t(key, vars){
  const s = (STR[LANG] && STR[LANG][key]) ?? STR.en[key] ?? key;
  return vars ? s.replace(/\{(\w+)\}/g, (_,k)=> vars[k] ?? '') : s;
}
function setLang(id, repaint = true){
  if(!STR[id]) id = 'en';
  LANG = id;
  localStorage.setItem('pt.lang', id);
  const meta = LANGS.find(l => l.id === id) || {};
  document.documentElement.lang = id;
  document.documentElement.dir = meta.dir || 'ltr';
  paintStatic();
  if(repaint && typeof refresh === 'function' && S.countries) refresh();
}
/* Anything with data-i18n in the markup is owned by the dictionary. */
function paintStatic(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.dataset.i18n);
  });
  document.title = t('title');
  const sel = document.getElementById('langsel');
  if(sel){
    sel.innerHTML = LANGS.map(l=>`<option value="${l.id}"${l.id===LANG?' selected':''}>${l.label}</option>`).join('');
  }
  const grid = document.getElementById('langgrid');
  if(grid){
    grid.innerHTML = LANGS.map(l=>`<button data-lang="${l.id}" class="${l.id===LANG?'on':''}" lang="${l.id}">${l.label}</button>`).join('');
    grid.querySelectorAll('button').forEach(b=> b.onclick = ()=> setLang(b.dataset.lang));
  }
  const esrc = document.getElementById('esrc');
  if(esrc) esrc.textContent = t('sources') + ' — ' + FEEDS.join(' · ');
  const fsrc = document.getElementById('footsrc');
  if(fsrc) fsrc.textContent = FEEDS.join(' · ');
  const fbtn = document.getElementById('focusbtn');
  if(fbtn) fbtn.textContent = document.body.classList.contains('focus') ? t('focus.show') : t('focus.hide');
  const ebtn = document.getElementById('enterbtn');
  if(ebtn) ebtn.querySelector('span').textContent = ebtn.disabled ? t('preparing') : t('enter');
  paintEntryKey();
}

let THEME_PREF = localStorage.getItem('pt.theme') || 'system';
let PAL = PALETTES.dark;

const mqDark = matchMedia('(prefers-color-scheme: dark)');
function resolveTheme(){ return THEME_PREF === 'system' ? (mqDark.matches ? 'dark' : 'light') : THEME_PREF; }

function setTheme(pref, repaint = true){
  THEME_PREF = pref;
  localStorage.setItem('pt.theme', pref);
  const resolved = resolveTheme();
  document.documentElement.dataset.theme = resolved;
  PAL = PALETTES[resolved];
  TIERS.forEach((tier,i)=> tier.hex = PAL.tiers[i]);
  NODATA = PAL.nodata;
  document.querySelectorAll('[data-theme-set]').forEach(b=>
    b.classList.toggle('on', b.dataset.themeSet === pref));
  paintEntryKey();
  if(repaint) repaintTheme();
}
mqDark.addEventListener('change', ()=>{ if(THEME_PREF === 'system') setTheme('system'); });

/* Push the new palette through everything WebGL is holding. */
function repaintTheme(){
  if(typeof renderer === 'undefined' || !renderer) return;
  renderer.setClearColor(PAL.clear, 1);
  if(atmo){ atmo.material.uniforms.uColor.value.fromArray(PAL.atmo); atmo.material.uniforms.uStrength.value = PAL.atmoStr; }
  if(stars){ stars.material.color.setHex(PAL.star); stars.material.opacity = PAL.starOp; stars.visible = PAL.starOp > 0; }
  if(borderLines){ borderLines.material.color.setHex(PAL.border); borderLines.material.opacity = PAL.borderOp; }
  if(hotspotLines){ hotspotLines.material.color.setHex(PAL.hot); hotspotLines.material.opacity = PAL.hotOp; }
  if(admin1Lines) admin1Lines.material.color.setHex(PAL.admin1);
  if(cityPoints) cityPoints.material.color.setHex(PAL.city);
  hatchPattern = null;                 // rebuilt with the new palette on next paint
  paint();
  if(S.countries) refresh();
}

/* The severity key on the entry screen doubles as the legend, so people learn
   the ramp before they ever look at the globe. */
function paintEntryKey(){
  const box = document.getElementById('ekey');
  if(!box) return;
  const ranges = ['0–19','20–39','40–59','60–79','80–100'];
  box.innerHTML = PAL.tiers.map((hex,i)=>`
    <div class="er">
      <span class="eswatch" style="background:${hex}"></span>
      <span class="ename">${esc(t('tier.'+i))}</span>
      <span class="erange">${ranges[i]}</span>
    </div>`).join('');
}

/* ── 1. SEVERITY ENGINE ───────────────────────────────────────────────────
   Implements the 0–100 index from the project spec: cases per 100k,
   case fatality rate, and 7-day growth. Tune the weights here and the whole
   map recolours — no other file needs to change. */

const WEIGHTS = { per100k:0.45, cfr:0.30, growth:0.25 };

function severityOf(d){
  if(d.severity != null) return clamp(d.severity,0,100);   // explicit override
  const inputs = [d.per100k, d.cfr, d.growth7d].filter(v => v != null);
  if(!inputs.length) return null;                          // NO DATA — never 0
  // log scale: 1/100k ≈ 20, 10 ≈ 47, 100 ≈ 73, 1000 ≈ 100
  const a = d.per100k  != null ? clamp(Math.log10(d.per100k + 1) / 3 * 100, 0, 100) : null;
  // 10% CFR saturates the scale
  const b = d.cfr      != null ? clamp(d.cfr / 10 * 100, 0, 100) : null;
  // +50% week-on-week saturates
  const c = d.growth7d != null ? clamp((d.growth7d + 10) / 60 * 100, 0, 100) : null;
  let num = 0, den = 0;
  if(a!=null){ num += a*WEIGHTS.per100k; den += WEIGHTS.per100k; }
  if(b!=null){ num += b*WEIGHTS.cfr;     den += WEIGHTS.cfr;     }
  if(c!=null){ num += c*WEIGHTS.growth;  den += WEIGHTS.growth;  }
  return den ? Math.round(num/den) : null;
}

const TIERS = [
  {max:19,  name:'contained', css:'--s0', hex:'#16A34A'},
  {max:39,  name:'moderate',  css:'--s1', hex:'#CA8A04'},
  {max:59,  name:'high',      css:'--s2', hex:'#EA580C'},
  {max:79,  name:'severe',    css:'--s3', hex:'#DC2626'},
  {max:100, name:'critical',  css:'--s4', hex:'#7F1D1D'}
];
let NODATA = '#39424F';   // overwritten by setTheme()
function tierOf(s){ return s==null ? {name:'no data',hex:NODATA} : TIERS.find(t=>s<=t.max); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* Roll child entities up to a parent. 60% worst-case, 40% population-weighted —
   so one critical province lifts the country without a big calm neighbour
   burying it. */
function rollup(children){
  const scored = children.filter(c => c.severity != null);
  if(!scored.length) return null;
  const worst = Math.max(...scored.map(c=>c.severity));
  let wsum=0, psum=0;
  scored.forEach(c=>{ const p=c.pop||1; wsum += c.severity*p; psum += p; });
  return Math.round(0.6*worst + 0.4*(wsum/psum));
}

async function fetchFirst(urls){
  let err;
  for(const u of urls){
    try{ const r = await fetch(u); if(r.ok) return await r.json(); err = new Error(r.status); }
    catch(e){ err = e; }
  }
  throw err;
}

/* ── 5. RESOLVE DATA → SEVERITY PER ENTITY ────────────────────────────── */

function diseaseSeverity(dis){
  const s = severityOf(dis);
  return s;
}
function entitySeverity(rec){
  if(!rec) return null;
  if(rec.severity != null) return clamp(rec.severity,0,100);
  if(!rec.diseases) return null;
  const vals = rec.diseases.map(diseaseSeverity).filter(v=>v!=null);
  return vals.length ? Math.max(...vals) : null;   // worst active disease drives the colour
}
function maxGrowth(rec){
  if(!rec || !rec.diseases) return null;
  const g = rec.diseases.map(d=>d.growth7d).filter(v=>v!=null);
  return g.length ? Math.max(...g) : null;
}
function maxPer100k(rec){
  if(!rec || !rec.diseases) return null;
  const p = rec.diseases.map(d=>d.per100k).filter(v=>v!=null);
  return p.length ? Math.max(...p) : null;
}

function buildEntities(){
  S.entities.clear();
  // countries
  for(const [iso,rec] of Object.entries(SEED.countries)){
    S.entities.set(iso, {key:iso, level:'country', sev:entitySeverity(rec), rec});
  }
  // admin1
  for(const [k,rec] of Object.entries(SEED.admin1)){
    S.entities.set(k, {key:k, level:'admin1', sev:entitySeverity(rec), rec});
  }
  // cities
  for(const [k,rec] of Object.entries(SEED.cities)){
    S.entities.set(k, {key:k, level:'city', sev:entitySeverity(rec), rec});
  }
  // continents = rollup of their countries
  for(const [cont, isos] of S.continents){
    const kids = isos.map(i=>{
      const e = S.entities.get(i);
      return e ? {severity:e.sev, pop:S.byISO.get(i)?.pop || 1} : null;
    }).filter(Boolean);
    const sev = rollup(kids);
    S.entities.set('C:'+cont, {key:'C:'+cont, level:'continent', sev, rec:{
      diseases: aggregateDiseases(isos), conf: worstConf(isos)
    }});
  }
}
function aggregateDiseases(isos){
  const m = new Map();
  isos.forEach(iso=>{
    const rec = SEED.countries[iso]; if(!rec) return;
    rec.diseases.forEach(d=>{
      const cur = m.get(d.name) || {name:d.name, cases:0, deaths:0, countries:0, source:d.source, url:d.url, asOf:d.asOf, provisional:d.provisional, _any:false};
      if(d.cases != null){ cur.cases += d.cases; cur._any = true; }
      if(d.deaths != null) cur.deaths += d.deaths;
      cur.countries++;
      if(d.asOf && (!cur.asOf || d.asOf > cur.asOf)) cur.asOf = d.asOf;
      m.set(d.name, cur);
    });
  });
  return [...m.values()].map(d=>({...d, cases:d._any?d.cases:null, deaths:d.deaths||null}))
    .sort((a,b)=>(b.cases||0)-(a.cases||0));
}
function worstConf(isos){
  const order = {low:0, medium:1, high:2};
  let w = null;
  isos.forEach(i=>{ const c = SEED.countries[i]?.conf; if(c && (w===null || order[c] < order[w])) w = c; });
  return w;
}

/* ── 6. EQUIRECTANGULAR TEXTURE PAINTER ───────────────────────────────────
   The globe is a sphere wearing a canvas. Repainting the canvas recolours
   the world; we only repaint when the zoom tier changes or data arrives. */

let TEX_W = 4096, TEX_H = 2048;
const tex = document.createElement('canvas');
tex.width = TEX_W; tex.height = TEX_H;
const tx = tex.getContext('2d');

function projX(lon){ return (lon + 180) / 360 * TEX_W; }
function projY(lat){ return (90 - lat) / 180 * TEX_H; }

function tracePoly(ctx, coords){
  coords.forEach(ring=>{
    ring.forEach(([lon,lat],i)=>{
      const x = projX(lon), y = projY(lat);
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.closePath();
  });
}
function traceFeature(ctx, geom){
  ctx.beginPath();
  if(geom.type === 'Polygon') tracePoly(ctx, geom.coordinates);
  else if(geom.type === 'MultiPolygon') geom.coordinates.forEach(p=>tracePoly(ctx,p));
}

/* Diagonal hatch = "we have no reporting from here." Visually distinct from
   green, because the spec is explicit that silence must not read as safety. */
let hatchPattern = null;
function makeHatch(){
  const c = document.createElement('canvas'); c.width = c.height = 12;
  const g = c.getContext('2d');
  g.fillStyle = PAL.hatchBg; g.fillRect(0,0,12,12);
  g.strokeStyle = PAL.hatchLine; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(-3,9); g.lineTo(9,-3); g.moveTo(3,15); g.lineTo(15,3); g.stroke();
  hatchPattern = tx.createPattern(c,'repeat');
}

function fillFor(sev, per100k){
  if(sev == null) return hatchPattern;
  const t = tierOf(sev);
  // saturation carries concentration: sparse zones stay pale, dense ones glow
  const dens = per100k == null ? 0.45 : clamp(Math.log10(per100k+1)/3, 0.25, 1);
  return shade(t.hex, 0.35 + dens*0.65);
}
function shade(hex, a){
  const n = parseInt(hex.slice(1),16);
  const r = n>>16, g = (n>>8)&255, b = n&255;
  // blend toward the ocean colour rather than using alpha, so overlaps stay clean
  const bg = PAL.blend;
  return `rgb(${Math.round(bg[0]+(r-bg[0])*a)},${Math.round(bg[1]+(g-bg[1])*a)},${Math.round(bg[2]+(b-bg[2])*a)})`;
}

function paint(){
  if(!hatchPattern) makeHatch();
  // ocean
  tx.fillStyle = PAL.ocean; tx.fillRect(0,0,TEX_W,TEX_H);

  // graticule — quiet, gives the sphere readable structure when zoomed out
  tx.strokeStyle = PAL.graticule; tx.lineWidth = 1.5;
  for(let lon=-180; lon<=180; lon+=15){ tx.beginPath(); tx.moveTo(projX(lon),0); tx.lineTo(projX(lon),TEX_H); tx.stroke(); }
  for(let lat=-75; lat<=75; lat+=15){ tx.beginPath(); tx.moveTo(0,projY(lat)); tx.lineTo(TEX_W,projY(lat)); tx.stroke(); }

  if(!S.countries) { commitTexture(); return; }

  // ── countries: fills only. Borders are drawn as vector lines (§6b) so they
  // stay crisp when you zoom. A soft glow stays in the texture because a glow
  // is supposed to be blurry.
  S.countries.features.forEach(f=>{
    const iso = isoOf(f);
    const e = S.entities.get(iso);
    const rec = SEED.countries[iso];
    traceFeature(tx, f.geometry);
    tx.fillStyle = fillFor(e?.sev ?? null, maxPer100k(rec));
    tx.fill('evenodd');

    const g = maxGrowth(rec);
    if(g != null && g >= 15){
      tx.save();
      tx.strokeStyle = PAL.hotGlow || 'rgba(255,255,255,.30)';
      tx.lineWidth = 14;
      tx.filter = 'blur(6px)';
      tx.stroke();
      tx.restore();
    }
  });

  // ── state / province fills, wherever we actually have data for them.
  // Boundaries are worldwide, but only regions with surveillance data get a
  // fill. Everything else keeps the country colour beneath it.
  if(S.lod !== 'world' && S.admin1){
    for(const [iso, regions] of Object.entries(S.admin1)){
      for(const [name, rings] of regions){
        const e = S.entities.get(iso + ':' + name);
        if(!e || e.sev == null) continue;
        tx.beginPath();
        for(const flat of rings){
          for(let i = 0; i + 1 < flat.length; i += 2){
            const x = projX(flat[i]), y = projY(flat[i+1]);
            i ? tx.lineTo(x, y) : tx.moveTo(x, y);
          }
          tx.closePath();
        }
        tx.fillStyle = fillFor(e.sev, maxPer100k(e.rec));
        tx.fill('evenodd');
      }
    }
  }

  commitTexture();
}
let texture = null;
function commitTexture(){ if(texture) texture.needsUpdate = true; }

function isoOf(f){
  const p = f.properties;
  let iso = p.ADM0_A3 || p.adm0_a3 || p.ISO_A3 || p.iso_a3;
  if(!iso || iso === '-99') iso = (p.ADMIN || p.admin || '').slice(0,3).toUpperCase();
  return iso;
}
function nameOf(f){ const p=f.properties; return p.ADMIN || p.admin || p.NAME || p.name || 'Unknown'; }
function contOf(f){ const p=f.properties; return p.CONTINENT || p.continent || 'Unknown'; }

/* ── 6b. CRISP BORDERS + ZOOM-DRIVEN DETAIL ───────────────────────────────
   Borders are real 3D line geometry sitting just above the sphere, so they
   stay sharp at any zoom instead of turning into magnified pixels.

   Three layers, each fading in as you get closer:

     always      country outlines
     z < 2.60    state / province lines   (worldwide, 218 countries)
     z < 1.95    major city markers       (capitals, megacities, pop >= 300k)

   The state and city layers are built ONCE, the first time you zoom in far
   enough, then just faded and toggled. Rebuilding them per frame would be
   far too slow — there are 137,000 line points in the state layer.

   Cities are tiered so the view never turns to soup: capitals and megacities
   appear first, then million-plus cities, then the rest only at full zoom. */

let borderLines = null, hotspotLines = null, admin1Lines = null, cityPoints = null, stars = null;

/* fade helper: 1 when z is at or below `lo`, 0 at or above `hi` */
function fadeIn(z, hi, lo){
  if(z >= hi) return 0;
  if(z <= lo) return 1;
  const t = (hi - z) / (hi - lo);
  return t * t * (3 - 2 * t);          // smoothstep
}

const FADE = {
  admin1: { hi:2.85, lo:2.50 },   // states begin appearing on the first scroll
  city:   { hi:2.10, lo:1.85 }    // cities a little further in
};

function buildLines(features, colour, opacity, radius, filter){
  const pts = [];
  for(const f of features){
    if(filter && !filter(f)) continue;
    const polys = f.geometry.type === 'Polygon'
      ? [f.geometry.coordinates]
      : f.geometry.coordinates;
    for(const poly of polys){
      for(const ring of poly){
        for(let i = 0; i < ring.length - 1; i++){
          const a = latLonToVec(ring[i][1],   ring[i][0],   radius);
          const b = latLonToVec(ring[i+1][1], ring[i+1][0], radius);
          pts.push(a.x, a.y, a.z, b.x, b.y, b.z);
        }
      }
    }
  }
  return finishLine(pts, colour, opacity);
}

/* The bundled admin1 file uses flat coordinate arrays — [lon,lat,lon,lat,…] —
   which is roughly half the size of nested pairs. */
function buildAdmin1Lines(){
  if(!S.admin1) return null;
  const pts = [];
  for(const regions of Object.values(S.admin1)){
    for(const [, rings] of regions){
      for(const flat of rings){
        for(let i = 0; i + 3 < flat.length; i += 2){
          const a = latLonToVec(flat[i+1], flat[i],   R*1.0025);
          const b = latLonToVec(flat[i+3], flat[i+2], R*1.0025);
          pts.push(a.x, a.y, a.z, b.x, b.y, b.z);
        }
      }
    }
  }
  return finishLine(pts, PAL.admin1, 0);
}

function finishLine(pts, colour, opacity){
  if(!pts.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const line = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    color: colour, transparent:true, opacity, depthWrite:false
  }));
  line.visible = opacity > 0;
  return line;
}

function buildCityPoints(){
  if(!S.cities) return null;
  const pos = [], tiers = [];
  for(const [, lon, lat, tier] of S.cities){
    const v = latLonToVec(lat, lon, R*1.004);
    pos.push(v.x, v.y, v.z);
    tiers.push(tier);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({
    color:PAL.city, size:0.006, sizeAttenuation:true,
    transparent:true, opacity:0, depthWrite:false
  }));
  p.userData.tiers = tiers;
  p.visible = false;
  return p;
}

function disposeLine(obj){
  if(!obj) return;
  spin.remove(obj);
  obj.geometry.dispose();
  obj.material.dispose();
}

/* Country outlines and hotspot flags — cheap, rebuilt whenever data changes */
function rebuildBorders(){
  if(!S.countries) return;

  if(!borderLines){
    borderLines = buildLines(S.countries.features, PAL.border, PAL.borderOp, R*1.0015);
    if(borderLines) spin.add(borderLines);
  }

  disposeLine(hotspotLines); hotspotLines = null;
  const hot = S.countries.features.filter(f=>{
    const g = maxGrowth(SEED.countries[isoOf(f)]);
    return g != null && g >= 15;
  });
  if(hot.length){
    hotspotLines = buildLines(hot, PAL.hot, PAL.hotOp, R*1.0035);
    if(hotspotLines) spin.add(hotspotLines);
  }
}

/* Called every frame — cheap, just adjusts opacity on prebuilt geometry */
function updateDetailLayers(){
  const a = fadeIn(cam.z, FADE.admin1.hi, FADE.admin1.lo);
  const c = fadeIn(cam.z, FADE.city.hi,   FADE.city.lo);

  if(a > 0 && !admin1Lines && S.admin1){
    admin1Lines = buildAdmin1Lines();
    if(admin1Lines) spin.add(admin1Lines);
  }
  if(admin1Lines){
    admin1Lines.material.opacity = a * PAL.admin1Op;
    admin1Lines.visible = a > 0.01;
  }

  if(c > 0 && !cityPoints && S.cities){
    cityPoints = buildCityPoints();
    if(cityPoints) spin.add(cityPoints);
  }
  if(cityPoints){
    cityPoints.material.opacity = c * 0.9;
    cityPoints.material.size = 0.004 + c * 0.004;
    cityPoints.visible = c > 0.01;
  }

  // datasets are preloaded at boot; this is just a safety net if that failed
  if(cam.z < FADE.admin1.hi + 0.4) ensureAdmin1();
  if(cam.z < FADE.city.hi   + 0.4) ensureCities();
}

/* ── 7. THREE.JS SCENE ────────────────────────────────────────────────── */

const R = 1;
let renderer, scene, camera, tilt, spin, globe, atmo, raycaster, sphereForPick;

let wellEl = null, wellW = 1, wellH = 1;

function initScene(){
  wellEl = document.getElementById('well');
  wellW = wellEl.clientWidth || innerWidth;
  wellH = wellEl.clientHeight || innerHeight;

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(wellW, wellH);
  renderer.setClearColor(PAL.clear, 1);
  wellEl.insertBefore(renderer.domElement, wellEl.firstChild);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(38, wellW/wellH, 0.01, 100);
  camera.position.set(0,0,3.1);

  tilt = new THREE.Group();            // rotates on X
  spin = new THREE.Group();            // rotates on Y  →  world = Rx · Ry · p
  tilt.add(spin); scene.add(tilt);

  // Use a bigger texture when the GPU can take it. Mobile stays at 4096.
  const maxT = renderer.capabilities.maxTextureSize || 4096;
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  if(maxT >= 8192 && !isMobile){
    TEX_W = 8192; TEX_H = 4096;
    tex.width = TEX_W; tex.height = TEX_H;
  }

  texture = new THREE.CanvasTexture(tex);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = false;

  const geo = new THREE.SphereGeometry(R, 96, 64);
  globe = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map:texture}));
  spin.add(globe);
  sphereForPick = globe;

  // Rim light. Colour and strength are uniforms so the theme switch can reach
  // them — on the light theme it drops to a faint edge instead of a halo.
  const atmoMat = new THREE.ShaderMaterial({
    uniforms:{ uColor:{value:new THREE.Vector3().fromArray(PAL.atmo)}, uStrength:{value:PAL.atmoStr} },
    transparent:true, side:THREE.BackSide, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal);
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying vec3 vN; uniform vec3 uColor; uniform float uStrength; void main(){
      float i = pow(0.72 - dot(vN, vec3(0.,0.,1.)), 3.0);
      gl_FragColor = vec4(uColor,1.0)*clamp(i,0.0,1.0)*uStrength; }`
  });
  atmo = new THREE.Mesh(new THREE.SphereGeometry(R*1.055, 64, 48), atmoMat);
  scene.add(atmo);

  stars = makeStars();
  scene.add(stars);
  raycaster = new THREE.Raycaster();

  // The well resizes when panels are hidden or a sheet opens, not just when
  // the window does, so watch the element rather than the window.
  new ResizeObserver(onResize).observe(wellEl);
  addEventListener('resize', onResize);
}

function makeStars(){
  const n = 2600, pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r = 28 + Math.random()*24;
    const th = Math.acos(2*Math.random()-1), ph = Math.random()*Math.PI*2;
    pos[i*3]   = r*Math.sin(th)*Math.cos(ph);
    pos[i*3+1] = r*Math.cos(th);
    pos[i*3+2] = r*Math.sin(th)*Math.sin(ph);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({
    color:PAL.star, size:0.09, sizeAttenuation:true, transparent:true, opacity:PAL.starOp
  }));
  p.visible = PAL.starOp > 0;
  return p;
}

function onResize(){
  if(!wellEl || !renderer) return;
  wellW = Math.max(1, wellEl.clientWidth);
  wellH = Math.max(1, wellEl.clientHeight);
  camera.aspect = wellW/wellH; camera.updateProjectionMatrix();
  renderer.setSize(wellW, wellH);
}

/* ── 8. CAMERA MATH ───────────────────────────────────────────────────────
   Inverse of three.js's own sphere parametrisation, so picking and marker
   placement agree exactly. Derivation in the guide, §4. */

function latLonToVec(lat, lon, r=R){
  const u = (lon+180)/360, v = (90-lat)/180;
  const phi = u*Math.PI*2, theta = v*Math.PI;
  return new THREE.Vector3(
    -r*Math.cos(phi)*Math.sin(theta),
     r*Math.cos(theta),
     r*Math.sin(phi)*Math.sin(theta)
  );
}
function uvToLatLon(uv){ return {lat: uv.y*180 - 90, lon: uv.x*360 - 180}; }

// rotation that brings (lat,lon) to face the camera
function facing(lat, lon){
  return { x: lat*Math.PI/180, y: Math.PI/2 - (lon+180)*Math.PI/180 };
}

const cam = { rx:0.28, ry:-1.2, z:3.1, trx:0.28, try_:-1.2, tz:3.1 };

const ZOOM_MIN = 1.28, ZOOM_MAX = 3.4;
const LOD_REGION = 2.75, LOD_CITY = 2.00;   // kept in step with FADE above

function currentLOD(){
  if(cam.z > LOD_REGION) return 'world';
  if(cam.z > LOD_CITY)   return 'region';
  return 'city';
}

/* ── 9. INTERACTION ───────────────────────────────────────────────────── */

let dragging=false, moved=0, px=0, py=0;
function bindInput(){
  const el = renderer.domElement;
  el.style.cursor = 'grab';
  el.addEventListener('pointerdown', e=>{
    dragging=true; moved=0; px=e.clientX; py=e.clientY; el.style.cursor='grabbing'; el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e=>{
    if(dragging){
      const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
      moved += Math.abs(dx)+Math.abs(dy);
      const k = 0.0042 * (cam.z/3.1);            // slower drag when zoomed in
      cam.try_ += dx*k; cam.trx += dy*k;
      cam.trx = clamp(cam.trx, -1.45, 1.45);
    } else {
      onHover(e);
    }
  });
  el.addEventListener('pointerup', e=>{
    dragging=false; el.style.cursor='grab';
    if(moved < 5) onClick(e);
  });
  el.addEventListener('pointerleave', ()=>{ dragging=false; hideTip(); });
  el.addEventListener('wheel', e=>{
    e.preventDefault();
    cam.tz = clamp(cam.tz + e.deltaY*0.0016, ZOOM_MIN, ZOOM_MAX);
  }, {passive:false});

  addEventListener('keydown', e=>{
    if(e.key === 'Escape') goUp();
    if(e.key === '+' || e.key === '=') cam.tz = clamp(cam.tz-0.2, ZOOM_MIN, ZOOM_MAX);
    if(e.key === '-') cam.tz = clamp(cam.tz+0.2, ZOOM_MIN, ZOOM_MAX);
  });
}

function pick(e){
  const rect = renderer.domElement.getBoundingClientRect();
  const m = new THREE.Vector2(
    ((e.clientX-rect.left)/rect.width)*2-1,
    -((e.clientY-rect.top)/rect.height)*2+1
  );
  raycaster.setFromCamera(m, camera);
  const hit = raycaster.intersectObject(sphereForPick, false)[0];
  if(!hit || !hit.uv) return null;
  return uvToLatLon(hit.uv);
}

/* point-in-polygon over GeoJSON, ray casting, holes handled by parity */
function inRing(lon, lat, ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
    if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function inGeom(lon, lat, geom){
  const polys = geom.type==='Polygon' ? [geom.coordinates] : geom.coordinates;
  for(const poly of polys){
    let hit = false;
    poly.forEach((ring,i)=>{ if(inRing(lon,lat,ring)) hit = !hit; });
    if(hit) return true;
  }
  return false;
}
/* The bundled admin1 file stores rings as flat [lon,lat,lon,lat,…] arrays,
   so point-in-polygon walks them two at a time. Parity across rings handles
   holes, same as the country test above. */
function inFlatRing(lon, lat, f){
  let inside = false;
  for(let i = 0, j = f.length - 2; i < f.length; j = i, i += 2){
    const xi = f[i], yi = f[i+1], xj = f[j], yj = f[j+1];
    if(((yi > lat) !== (yj > lat)) &&
       (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function inFlatRings(lon, lat, rings){
  let hit = false;
  for(const flat of rings) if(inFlatRing(lon, lat, flat)) hit = !hit;
  return hit;
}
function centroidOfFlat(rings){
  let best = null, bl = 0;
  for(const flat of rings) if(flat.length > bl){ bl = flat.length; best = flat; }
  if(!best) return {lat:0, lon:0};
  let sx = 0, sy = 0, n = 0;
  for(let i = 0; i + 1 < best.length; i += 2){ sx += best[i]; sy += best[i+1]; n++; }
  return {lon: sx/n, lat: sy/n};
}

function findCountry(lat, lon){
  if(!S.countries) return null;
  return S.countries.features.find(f=>inGeom(lon,lat,f.geometry)) || null;
}
function findAdmin1(lat, lon, iso){
  if(!S.admin1) return null;
  const regions = S.admin1[iso];
  if(!regions) return null;
  for(const [name, rings] of regions){
    if(inFlatRings(lon, lat, rings)) return {name, rings, iso};
  }
  // Simplifying 38 MB of boundaries down to 2.8 MB shaves detail off
  // coastlines, so a click on a waterfront city can land just outside every
  // polygon. Fall back to the nearest boundary within ~60 km.
  return nearestRegion(lat, lon, regions, 0.6);
}

function nearestRegion(lat, lon, regions, maxDeg){
  let best = null, bd = Infinity;
  const cos = Math.cos(lat * Math.PI / 180);
  for(const [name, rings] of regions){
    for(const flat of rings){
      for(let i = 0; i + 1 < flat.length; i += 2){
        const d = Math.hypot(flat[i+1] - lat, (flat[i] - lon) * cos);
        if(d < bd){ bd = d; best = {name, rings, iso:regions.iso}; }
      }
    }
  }
  if(bd > maxDeg || !best) return null;
  const hit = regions.find(r => r[0] === best.name);
  return hit ? {name:hit[0], rings:hit[1]} : null;
}
function regionByName(iso, name){
  const regions = S.admin1 && S.admin1[iso];
  if(!regions) return null;
  const hit = regions.find(r => r[0] === name);
  return hit ? {name:hit[0], rings:hit[1], iso} : null;
}
/* Nearest major city to a point. Checks the bundled geography first, then
   looks for a matching record in the surveillance data. */
function findCityNear(lat, lon, maxDeg){
  if(!S.cities) return null;
  const cosLat = Math.cos(lat * Math.PI / 180);
  let best = null, bd = Infinity;
  for(const c of S.cities){
    const d = Math.hypot(c[2] - lat, (c[1] - lon) * cosLat);
    if(d < bd){ bd = d; best = c; }
  }
  if(bd > maxDeg || !best) return null;
  const [name, lonC, latC, tier, iso, adm1] = best;
  return { name, lon:lonC, lat:latC, tier, iso, adm1,
           key: iso + ':' + name,
           rec: SEED.cities[iso + ':' + name] || null };
}

/* ── 10. DRILL-DOWN ────────────────────────────────────────────────────── */

function onClick(e){
  const ll = pick(e); if(!ll) return;
  const lod = currentLOD();

  // deepest tier first: a city marker beats the region under it
  if(lod === 'city'){
    const c = findCityNear(ll.lat, ll.lon, 2.2);
    if(c){ selectCity(c); return; }
  }

  const f = findCountry(ll.lat, ll.lon);
  if(!f) return;
  const iso = isoOf(f);

  if(lod === 'world' && S.view.level === 'world'){
    selectContinent(contOf(f));
    return;
  }
  if(lod !== 'world'){
    const a = findAdmin1(ll.lat, ll.lon, iso);
    if(a && (S.view.iso === iso || lod === 'city')){ selectAdmin1(iso, a); return; }
  }
  selectCountry(iso, f);
}

const _cent = new WeakMap();
function centroidOf(f){
  if(_cent.has(f)) return _cent.get(f);
  const c = computeCentroid(f); _cent.set(f, c); return c;
}
function computeCentroid(f){
  // area-weighted-ish: mean of the largest ring, good enough to aim a camera
  let best=null, bl=0;
  const polys = f.geometry.type==='Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  polys.forEach(p=>{ if(p[0].length > bl){ bl = p[0].length; best = p[0]; } });
  if(!best) return {lat:0, lon:0};
  let sx=0, sy=0;
  best.forEach(([lo,la])=>{ sx+=lo; sy+=la; });
  return {lon:sx/best.length, lat:sy/best.length};
}

function flyTo(lat, lon, z){
  const r = facing(lat, lon);
  cam.trx = clamp(r.x, -1.45, 1.45);
  // choose the equivalent angle nearest the current one so it never spins the long way
  let ty = r.y;
  while(ty - cam.try_ >  Math.PI) ty -= Math.PI*2;
  while(ty - cam.try_ < -Math.PI) ty += Math.PI*2;
  cam.try_ = ty;
  cam.tz = clamp(z, ZOOM_MIN, ZOOM_MAX);
}

const CONTINENT_VIEW = {
  'Africa':{lat:2,lon:20,z:2.05},'Europe':{lat:52,lon:14,z:2.0},
  'Asia':{lat:32,lon:92,z:1.95},'North America':{lat:44,lon:-100,z:2.0},
  'South America':{lat:-16,lon:-60,z:2.05},'Oceania':{lat:-25,lon:140,z:2.05},
  'Antarctica':{lat:-78,lon:0,z:2.2}
};

function selectContinent(cont){
  S.view = {level:'continent', continent:cont, iso:null, region:null, city:null};
  const v = CONTINENT_VIEW[cont] || {lat:0,lon:0,z:2.1};
  flyTo(v.lat, v.lon, v.z);
  refresh();
}
function selectCountry(iso, feature){
  const f = feature || S.countries.features.find(x=>isoOf(x)===iso);
  S.view = {level:'country', continent:f?contOf(f):S.view.continent, iso, region:null, city:null};
  if(f){ const c = centroidOf(f); flyTo(c.lat, c.lon, 1.72); }
  ensureAdmin1();
  refresh();
}
function selectAdmin1(iso, region){
  S.view = {level:'admin1', continent:S.view.continent, iso, region:region.name, city:null};
  const c = centroidOfFlat(region.rings);
  flyTo(c.lat, c.lon, 1.55);
  refresh();
}
function selectCity(c){
  S.view = {level:'city', continent:S.view.continent, iso:c.iso,
            region: c.adm1 || S.view.region, city:c.name};
  flyTo(c.lat, c.lon, 1.34);
  refresh();
}
function goWorld(){ S.view={level:'world',continent:null,iso:null,region:null,city:null}; cam.tz=3.1; refresh(); }
function goUp(){
  const v = S.view;
  if(v.level==='city')      { v.level = v.region ? 'admin1' : 'country'; v.city=null; cam.tz=1.6; }
  else if(v.level==='admin1'){ v.level='country'; v.region=null; cam.tz=1.75; }
  else if(v.level==='country'){ selectContinent(v.continent||'Africa'); return; }
  else goWorld();
  refresh();
}

let lastLOD = 'world', lastFocus = null;
function ensureAdmin1(){
  if(S.admin1 || S._a1loading || S._a1failed) return;
  S._a1loading = true;
  fetchFirst(GEO.admin1)
    .then(j=>{ S.admin1 = j; paint(); })
    .catch(()=>{
      S._a1failed = true;
      note(t('note.admin1'));
    })
    .finally(()=>{ S._a1loading = false; });
}
function ensureCities(){
  if(S.cities || S._ctloading || S._ctfailed) return;
  S._ctloading = true;
  fetchFirst(GEO.cities)
    .then(j=>{ S.cities = j; })
    .catch(()=>{
      S._ctfailed = true;
      note(t('note.cities'));
    })
    .finally(()=>{ S._ctloading = false; });
}

/* ── 11. HOVER ────────────────────────────────────────────────────────── */

const tip = document.getElementById('tip');
let hoverRAF = 0;
function onHover(e){
  if(hoverRAF) return;
  hoverRAF = requestAnimationFrame(()=>{
    hoverRAF = 0;
    const ll = pick(e);
    if(!ll){ hideTip(); return; }
    const lod = currentLOD();
    let name = null, rec = null, sev = null, note = null;

    const f = findCountry(ll.lat, ll.lon);
    const iso = f ? isoOf(f) : null;

    // city marker under the cursor?
    if(lod === 'city'){
      const c = findCityNear(ll.lat, ll.lon, 1.6);
      if(c){
        name = c.name;
        rec  = c.rec;
        if(!rec && c.adm1) rec = SEED.admin1[c.iso + ':' + c.adm1] || null;
        if(rec) note = c.rec ? null : t('tip.figuresFor', {region:c.adm1});
        if(!rec && iso){ rec = SEED.countries[iso]; note = t('tip.national'); }
        sev = rec ? entitySeverity(rec) : null;
      }
    }

    // state / province
    if(!name && lod !== 'world' && iso){
      const a = findAdmin1(ll.lat, ll.lon, iso);
      if(a){
        name = a.name;
        rec  = SEED.admin1[iso + ':' + a.name] || null;
        if(!rec){ rec = SEED.countries[iso]; note = rec ? t('tip.national') : null; }
        sev = rec ? entitySeverity(rec) : null;
      }
    }

    // country
    if(!name && f){
      name = nameOf(f); rec = SEED.countries[iso];
      sev = rec ? entitySeverity(rec) : null;
    }

    if(!name){ hideTip(); return; }
    showTip(e, name, rec, sev, note);
  });
}
function showTip(e, name, rec, sev, scopeNote){
  const tr = tierOf(sev);
  const dis = (rec && rec.diseases) ? rec.diseases : [];
  const rows = dis.slice(0,3).map(d=>{
    const n = d.cases!=null ? t('cases',{n:fmt(d.cases)}) : t('nocount');
    return `<div class="td"><span>${esc(d.name)}</span><span>${n} ${trendArrow(d.growth7d)}</span></div>`;
  }).join('') || `<div class="td"><span>${t('tip.none')}</span><span>—</span></div>`;
  const fresh = freshness(freshestAsOf(dis));
  tip.innerHTML = `<div class="tn">${esc(name)}</div>${rows}
    ${scopeNote ? `<div class="td" style="color:var(--ink-dim);font-style:italic">${esc(scopeNote)}</div>` : ''}
    <div class="tt" style="color:${tr.hex}">
      <span style="width:6px;height:6px;border-radius:50%;background:${tr.hex};display:block"></span>${esc(tierLabel(sev))}${sev!=null?' · '+sev:''}
      <span style="margin-inline-start:auto;color:${fresh.hex}">${fresh.label}</span>
    </div>`;
  // coordinates are relative to the well, and the card flips before it would
  // run off the far edge
  const box = wellEl.getBoundingClientRect();
  const x = e.clientX - box.left, y = e.clientY - box.top;
  const flip = x > box.width - 270;
  tip.style.left = x+'px'; tip.style.top = y+'px';
  tip.style.transform = flip ? 'translate(calc(-100% - 14px),-50%)' : 'translate(14px,-50%)';
  tip.style.opacity = 1;
}
function hideTip(){ tip.style.opacity = 0; }

/* ── 12. FRESHNESS ────────────────────────────────────────────────────────
   Every number on this map is only as good as its date. Sources report at
   wildly different speeds — WHO posts a bulletin the week it happens, ECDC
   reports by ISO week, some national agencies run a month behind. So every
   figure carries its own age, shown everywhere it appears.

   Handles both "2026-07-15" and ISO week strings like "2026-W20". */

function parseAsOf(s){
  if(!s) return null;
  const wk = /^(\d{4})-W(\d{1,2})$/.exec(String(s));
  if(wk){
    const year = +wk[1], week = +wk[2];
    const jan4 = new Date(Date.UTC(year, 0, 4));
    const mondayOffset = (jan4.getUTCDay() + 6) % 7;
    const week1Monday = jan4.getTime() - mondayOffset * 86400000;
    return new Date(week1Monday + (week * 7 - 1) * 86400000);  // end of that week
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function ageDays(asOf){
  const d = parseAsOf(asOf);
  if(!d) return null;
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000));
}

/* Four bands. The thresholds match how often the sources actually publish:
   a weekly source is doing its job at 7 days, badly behind at 30. */
function freshness(asOf){
  const d = ageDays(asOf);
  if(d == null) return { label:t('age.nodate'), short:'—',    hex:PAL.dim,  rank:4 };
  if(d <= 8)    return { label:ago(d), short:ago(d, true), hex:PAL.ok,   rank:0 };
  if(d <= 30)   return { label:ago(d), short:ago(d, true), hex:PAL.warn, rank:1 };
  if(d <= 90)   return { label:ago(d), short:ago(d, true), hex:PAL.mid,  rank:2 };
  return          { label:ago(d), short:ago(d, true), hex:PAL.bad,  rank:3 };
}

function ago(d, terse){
  // terse form goes in the log gutter, where there is room for about six
  // characters and the column header already says what it is
  if(terse){
    if(d === 0) return '0d';
    if(d < 14)  return d + 'd';
    if(d < 70)  return Math.round(d/7) + 'w';
    return Math.round(d/30) + 'mo';
  }
  if(d === 0) return t('age.today');
  if(d === 1) return t('age.yesterday');
  if(d < 14)  return t('age.days',   {n:d});
  if(d < 70)  return t('age.weeks',  {n:Math.round(d/7)});
  return         t('age.months', {n:Math.round(d/30)});
}

/* The freshest figure anywhere in a record — what the headline badge shows. */
function freshestAsOf(diseases){
  const dated = (diseases||[]).map(d=>d.asOf).filter(Boolean);
  if(!dated.length) return null;
  return dated.sort((a,b)=>(ageDays(a)??99999)-(ageDays(b)??99999))[0];
}

function bestFreshness(rec){
  if(!rec || !rec.diseases || !rec.diseases.length) return freshness(null);
  return rec.diseases
    .map(d => freshness(d.asOf))
    .sort((a,b) => a.rank - b.rank)[0];
}

function freshBadge(asOf, extra){
  const f = freshness(asOf);
  return `<span class="fresh" style="color:${f.hex}">
    <span class="freshdot" style="background:${f.hex}"></span>${f.label}${extra?' · '+extra:''}</span>`;
}

/* ── 13. UI RENDER ────────────────────────────────────────────────────── */

const $ = s=>document.querySelector(s);
const fmt = n => n==null ? '—' : n.toLocaleString(LOCALE[LANG] || 'en-US');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Tier names are translated; the hex comes from the active palette. */
function tierIndex(sev){ return sev==null ? -1 : TIERS.findIndex(x=>sev<=x.max); }
function tierLabel(sev){ const i = tierIndex(sev); return i<0 ? t('tier.none') : t('tier.'+i); }

function trendArrow(g){
  if(g==null) return '';
  if(g > 5)  return `<span style="color:${PAL.bad}">▲${Math.round(g)}%</span>`;
  if(g < -5) return `<span style="color:${PAL.ok}">▼${Math.abs(Math.round(g))}%</span>`;
  return `<span style="color:${PAL.flat}">▬</span>`;
}

function currentEntity(){
  const v = S.view;
  if(v.level==='city')    return {name:v.city, key:v.iso+':'+v.city, rec:SEED.cities[v.iso+':'+v.city], label:t('sel.city')};
  if(v.level==='admin1')  return {name:v.region, key:v.iso+':'+v.region, rec:SEED.admin1[v.iso+':'+v.region], label:t('sel.state')};
  if(v.level==='country'){
    const f = S.countries?.features.find(x=>isoOf(x)===v.iso);
    return {name:f?nameOf(f):v.iso, key:v.iso, rec:SEED.countries[v.iso], label:t('sel.country')};
  }
  if(v.level==='continent') return {name:continentLabel(v.continent), key:'C:'+v.continent,
    rec:S.entities.get('C:'+v.continent)?.rec, label:t('sel.continent')};
  return {name:t('sel.world'), key:'GLOBAL', rec:{diseases:aggregateDiseases(Object.keys(SEED.countries)), conf:null}, label:t('sel.world')};
}

  const key = 'cont.' + (CONTINENT_LABEL[cont] || cont);
  const s = (STR[LANG] && STR[LANG][key]) || STR.en[key];
  return s || CONTINENT_LABEL[cont] || cont;
}
